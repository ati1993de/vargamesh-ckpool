name: VargaMesh fixed fee tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fee-test:
    name: Verify fixed 1% VMESH development fee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python3 -m py_compile bridge/vargamesh-auxpow-bridge.py tests/test_bridge_fee.py
      - name: AuxPoW bridge integration self-test
        run: python3 bridge/vargamesh-auxpow-bridge.py --self-test
      - name: Coinbase fee and payout unit tests
        run: python3 -m unittest discover -s tests -p 'test_bridge_fee.py' -v
